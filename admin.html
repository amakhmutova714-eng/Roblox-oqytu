<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Roblox Oqytu</title>
  <style>
    :root {
      --bg:    #0a1628;
      --bg2:   #0d1e38;
      --card:  #0f2244;
      --card2: #162d58;
      --border: rgba(56,189,248,0.18);
      --accent:  #38bdf8;
      --accent2: #818cf8;
      --green:   #34d399;
      --red:     #fb7185;
      --text:    #e2e8f0;
      --text2:   #7e9bb5;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:15px; min-height:100vh; }

    /* LOGIN */
    #login-screen {
      display:flex; align-items:center; justify-content:center; min-height:100vh;
    }
    .login-box {
      background:var(--card); border:1px solid var(--border); border-radius:16px;
      padding:2.5rem; width:360px; text-align:center;
    }
    .login-box h1 { font-size:1.4rem; margin-bottom:0.4rem; }
    .login-box p  { color:var(--text2); margin-bottom:2rem; font-size:0.9rem; }
    .login-box input {
      width:100%; padding:0.75rem 1rem; border-radius:10px;
      border:1px solid var(--border); background:var(--bg2);
      color:var(--text); font-size:1rem; margin-bottom:1rem; outline:none;
    }
    .login-box input:focus { border-color:var(--accent); }
    .login-box button {
      width:100%; padding:0.85rem; border-radius:10px; border:none;
      background:var(--accent); color:#0a1628; font-size:1rem;
      font-weight:700; cursor:pointer;
    }
    .login-box button:hover { opacity:0.9; }
    #login-error { color:var(--red); font-size:0.9rem; margin-top:0.75rem; display:none; }

    /* DASHBOARD */
    #dashboard { display:none; }

    header {
      background:var(--card); border-bottom:1px solid var(--border);
      padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between;
    }
    header h1 { font-size:1.2rem; color:var(--accent); }
    .logout-btn {
      padding:0.4rem 1rem; border-radius:8px; border:1px solid var(--border);
      background:transparent; color:var(--text2); cursor:pointer; font-size:0.85rem;
    }
    .logout-btn:hover { color:var(--text); border-color:var(--accent); }

    .dashboard-wrap { padding:2rem; max-width:1300px; margin:0 auto; }

    /* STATS */
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; margin-bottom:2rem; }
    .stat-card {
      background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:1.5rem; text-align:center;
    }
    .stat-card .sv { font-size:2.5rem; font-weight:800; color:var(--accent); }
    .stat-card .sl { font-size:0.9rem; color:var(--text2); margin-top:0.3rem; }

    /* TABS */
    .tab-bar { display:flex; gap:0.75rem; margin-bottom:1.5rem; }
    .tab-btn {
      padding:0.6rem 1.4rem; border-radius:10px; border:1px solid var(--border);
      background:transparent; color:var(--text2); cursor:pointer; font-size:0.9rem;
      transition:all 0.2s;
    }
    .tab-btn.active { background:var(--accent); color:#0a1628; border-color:var(--accent); font-weight:700; }

    /* TABLE */
    .table-wrap {
      background:var(--card); border:1px solid var(--border); border-radius:14px;
      overflow:hidden;
    }
    .table-title {
      padding:1rem 1.5rem; border-bottom:1px solid var(--border);
      font-weight:600; color:var(--accent); font-size:0.95rem;
      display:flex; align-items:center; justify-content:space-between;
    }
    .refresh-btn {
      padding:0.35rem 0.9rem; border-radius:8px; border:1px solid var(--border);
      background:transparent; color:var(--text2); cursor:pointer; font-size:0.8rem;
    }
    .refresh-btn:hover { color:var(--accent); border-color:var(--accent); }
    table { width:100%; border-collapse:collapse; }
    th {
      padding:0.75rem 1rem; text-align:left; font-size:0.8rem;
      color:var(--text2); text-transform:uppercase; letter-spacing:0.05em;
      border-bottom:1px solid var(--border); background:var(--bg2);
    }
    td { padding:0.85rem 1rem; border-bottom:1px solid rgba(56,189,248,0.07); font-size:0.9rem; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(56,189,248,0.04); }

    .badge-green {
      display:inline-block; padding:0.2rem 0.6rem; border-radius:6px;
      background:rgba(52,211,153,0.15); color:var(--green);
      font-size:0.78rem; font-weight:600;
    }
    .badge-blue {
      display:inline-block; padding:0.2rem 0.6rem; border-radius:6px;
      background:rgba(56,189,248,0.15); color:var(--accent);
      font-size:0.78rem; font-weight:600;
    }

    .search-bar {
      padding:0.6rem 1rem; border-radius:10px; border:1px solid var(--border);
      background:var(--bg2); color:var(--text); font-size:0.9rem; outline:none;
      width:280px; margin-bottom:1rem;
    }
    .search-bar:focus { border-color:var(--accent); }

    .empty-msg { text-align:center; color:var(--text2); padding:3rem 1rem; }

    @media(max-width:700px) {
      .stats-row { grid-template-columns:1fr; }
      .dashboard-wrap { padding:1rem; }
      header { padding:0.75rem 1rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin панелі</h1>
    <p>Roblox Oqytu — Albina M.</p>
    <input type="password" id="admin-password" placeholder="Пароль" onkeydown="if(event.key==='Enter')adminLogin()"/>
    <button onclick="adminLogin()">Кіру</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <h1>🎮 Roblox Oqytu — Admin</h1>
    <button class="logout-btn" onclick="adminLogout()">Шығу</button>
  </header>

  <div class="dashboard-wrap">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="sv" id="stat-students">—</div>
        <div class="sl">Барлық оқушы</div>
      </div>
      <div class="stat-card">
        <div class="sv" id="stat-visits">—</div>
        <div class="sl">Барлық кіру</div>
      </div>
      <div class="stat-card">
        <div class="sv" id="stat-today">—</div>
        <div class="sl">Бүгін кіру</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="showTab('students', this)">Оқушылар</button>
      <button class="tab-btn"        onclick="showTab('activity', this)">Кіру тарихы</button>
    </div>

    <!-- Students -->
    <div id="tab-students">
      <input class="search-bar" id="student-search" type="text" placeholder="Оқушы іздеу..." oninput="filterStudents()"/>
      <div class="table-wrap">
        <div class="table-title">
          Тіркелген оқушылар
          <button class="refresh-btn" onclick="loadStudents()">↻ Жаңарту</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Аты</th>
              <th>Телефон / Email</th>
              <th>Тіркелді</th>
              <th>Соңғы кіру</th>
              <th>Ашқан сабақ</th>
              <th>Кіру саны</th>
            </tr>
          </thead>
          <tbody id="students-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Activity -->
    <div id="tab-activity" style="display:none;">
      <input class="search-bar" id="activity-search" type="text" placeholder="Іздеу..." oninput="filterActivity()"/>
      <div class="table-wrap">
        <div class="table-title">
          Кіру тарихы (соңғы 500)
          <button class="refresh-btn" onclick="loadActivity()">↻ Жаңарту</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Оқушы</th>
              <th>Сабақ</th>
              <th>Уақыт</th>
            </tr>
          </thead>
          <tbody id="activity-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const ADMIN_TOKEN_KEY = 'roblox_admin_token';
  let studentsData = [];
  let activityData = [];

  function getAdminToken() { return localStorage.getItem(ADMIN_TOKEN_KEY); }

  async function adminLogin() {
    const pw  = document.getElementById('admin-password').value;
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (!res.ok) {
      const el = document.getElementById('login-error');
      el.textContent = data.error || 'Пароль қате';
      el.style.display = 'block';
      return;
    }
    localStorage.setItem(ADMIN_TOKEN_KEY, data.token);
    showDashboard();
  }

  function adminLogout() {
    localStorage.removeItem(ADMIN_TOKEN_KEY);
    location.reload();
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadStats();
    loadStudents();
  }

  async function loadStats() {
    const res = await authFetch('/api/admin/stats');
    if (!res) return;
    const d = await res.json();
    document.getElementById('stat-students').textContent = d.totalStudents;
    document.getElementById('stat-visits').textContent   = d.totalVisits;
    document.getElementById('stat-today').textContent    = d.todayVisits;
  }

  async function loadStudents() {
    const res = await authFetch('/api/admin/students');
    if (!res) return;
    studentsData = await res.json();
    renderStudents(studentsData);
  }

  async function loadActivity() {
    const res = await authFetch('/api/admin/activity');
    if (!res) return;
    activityData = await res.json();
    renderActivity(activityData);
  }

  function renderStudents(list) {
    const tbody = document.getElementById('students-tbody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">Оқушы жоқ</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(s => `
      <tr>
        <td><strong>${esc(s.name)}</strong></td>
        <td style="color:var(--text2)">${esc(s.contact)}</td>
        <td style="color:var(--text2)">${fmtDate(s.registeredAt)}</td>
        <td style="color:var(--text2)">${fmtDate(s.lastSeenAt)}</td>
        <td><span class="badge-green">${s.lessonsOpened} сабақ</span></td>
        <td><span class="badge-blue">${s.totalVisits} рет</span></td>
      </tr>`).join('');
  }

  function renderActivity(list) {
    const tbody = document.getElementById('activity-tbody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">Тарих жоқ</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(a => `
      <tr>
        <td><strong>${esc(a.studentName)}</strong></td>
        <td style="color:var(--text2)">${esc(a.lessonTitle || a.lessonId)}</td>
        <td style="color:var(--text2)">${fmtDate(a.visitedAt)}</td>
      </tr>`).join('');
  }

  function filterStudents() {
    const q = document.getElementById('student-search').value.toLowerCase();
    renderStudents(studentsData.filter(s =>
      s.name.toLowerCase().includes(q) || s.contact.toLowerCase().includes(q)
    ));
  }

  function filterActivity() {
    const q = document.getElementById('activity-search').value.toLowerCase();
    renderActivity(activityData.filter(a =>
      (a.studentName||'').toLowerCase().includes(q) ||
      (a.lessonTitle||'').toLowerCase().includes(q)
    ));
  }

  function showTab(id, btn) {
    document.getElementById('tab-students').style.display = id === 'students' ? '' : 'none';
    document.getElementById('tab-activity').style.display = id === 'activity' ? '' : 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (id === 'activity' && activityData.length === 0) loadActivity();
  }

  async function authFetch(url) {
    const token = getAdminToken();
    const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { adminLogout(); return null; }
    return res;
  }

  function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} `
         + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function esc(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  if (getAdminToken()) showDashboard();
</script>
</body>
</html>
